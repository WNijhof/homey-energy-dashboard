<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Energie</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Energie</h1>
      <p class="subtitle"><span id="today-label"></span><span id="status" class="status"><i></i><span>Verbinden…</span></span></p>
    </div>
    <div class="header-actions">
      <nav class="segmented" id="periods" aria-label="Periode">
        <button data-period="today" class="active">Vandaag</button>
        <button data-period="yesterday">Gisteren</button>
        <button data-period="week">Week</button>
        <button data-period="month">Maand</button>
      </nav>
      <button class="icon-button" id="edit-toggle" type="button" title="Indeling bewerken" aria-label="Indeling bewerken">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- Filled with the blocks below, in the order and sizes of the chosen layout -->
  <main class="grid" id="blocks"></main>

  <div class="tooltip" id="tooltip" hidden></div>

  <!-- Edit mode: drag blocks by their handle, drag the right edge to change the width -->
  <div class="edit-bar" id="edit-bar" hidden>
    <p class="edit-hint">Sleep <b>⠿</b> om een blok te verplaatsen. Sleep de rand rechts voor de breedte en de rand onder voor de hoogte.</p>
    <div class="edit-hidden" id="edit-hidden"></div>
    <div class="edit-actions">
      <input id="edit-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Pincode" hidden>
      <button type="button" class="link" id="edit-default">Standaard</button>
      <span class="edit-status" id="edit-status"></span>
      <button type="button" class="secondary" id="edit-cancel">Annuleren</button>
      <button type="button" class="primary" id="edit-save">Opslaan</button>
    </div>
  </div>

  <template id="block-flow">
    <section class="card">
      <div class="card-head">
        <h2>Nu</h2>
        <span class="muted" id="live-updated"></span>
      </div>
      <div id="flow" class="fill"></div>
    </section>
  </template>

  <template id="block-waterheater">
    <section class="card boiler-card" id="boiler-card">
      <div class="card-head">
        <h2 id="boiler-name">Warm water</h2>
        <span class="chip" id="boiler-mode" data-boiler></span>
      </div>
      <p class="block-empty" id="boiler-empty" hidden>Geen boiler gevonden. Kies er een bij de instellingen.</p>
      <div class="boiler-body" data-boiler>
        <div class="gauge" id="boiler-gauge"></div>
        <div class="boiler-facts">
          <div class="big-fact">
            <span class="big-number" id="shower-minutes">–</span>
            <span class="big-unit">doucheminuten</span>
          </div>
          <ul class="facts">
            <li id="boiler-showers-row"><span>Douchebeurten</span><strong id="boiler-showers">–</strong></li>
            <li><span>Ingesteld</span><strong id="boiler-target">–</strong></li>
            <li id="boiler-heating-row"><span>Opwarmen</span><strong id="boiler-heating">–</strong></li>
          </ul>
        </div>
      </div>
      <div class="sparkline fill" id="boiler-history" data-boiler></div>
      <p class="footnote" id="boiler-note" data-boiler></p>
    </section>
  </template>

  <template id="block-heating">
    <section class="card heating-card">
      <div class="card-head">
        <h2>Verwarming</h2>
        <span class="chip" id="heating-mode"></span>
      </div>
      <p class="block-empty" id="heating-empty" hidden>Geen warmtepomp, cv-ketel of thermostaat gevonden. Kies ze bij de instellingen.</p>
      <div class="heating-body" data-heating>
        <div class="room-temp" id="room-temp"></div>
        <ul class="facts" id="heating-facts"></ul>
      </div>
      <div class="chart fill" id="heating-chart" data-height="120" data-heating></div>
    </section>
  </template>

  <template id="block-ev">
    <section class="card ev-card">
      <div class="card-head">
        <h2 id="ev-name">Laadpaal</h2>
        <span class="chip" id="ev-state"></span>
      </div>
      <p class="block-empty" id="ev-empty" hidden>Geen laadpaal gevonden. Kies er een bij de instellingen.</p>
      <div class="ev-body" data-ev>
        <div class="big-fact">
          <span class="big-number" id="ev-power">–</span>
          <span class="big-unit" id="ev-power-label">vermogen</span>
        </div>
        <ul class="facts" id="ev-facts"></ul>
      </div>
      <div class="chart fill" id="ev-chart" data-height="120" data-ev></div>
    </section>
  </template>

  <template id="block-tiles">
    <section class="tiles-block">
      <div class="tiles" id="tiles"></div>
    </section>
  </template>

  <template id="block-electricity">
    <section class="card">
      <div class="card-head">
        <h2>Elektriciteit</h2>
        <div class="legend" id="electricity-legend"></div>
      </div>
      <div class="chart fill" id="electricity-chart"></div>
    </section>
  </template>

  <template id="block-consumers">
    <section class="card">
      <div class="card-head">
        <h2>Apparaten nu</h2>
      </div>
      <ul class="consumers fill scroll" id="consumers"></ul>
    </section>
  </template>

  <template id="block-sankey">
    <section class="card">
      <div class="card-head">
        <h2>Energiestromen</h2>
        <div class="sankey-head">
          <nav class="segmented small" id="sankey-mode" aria-label="Weergave">
            <button type="button" data-mode="live">Live</button>
            <button type="button" data-mode="period">Periode</button>
          </nav>
          <span class="muted" id="sankey-period"></span>
        </div>
      </div>
      <div id="sankey" class="fill"></div>
    </section>
  </template>

  <template id="block-solar">
    <section class="card">
      <div class="card-head">
        <h2>Zonne-energie</h2>
        <span class="muted" id="solar-total"></span>
      </div>
      <div class="chart fill" id="solar-chart" data-height="160"></div>
    </section>
  </template>

  <template id="block-gas">
    <section class="card">
      <div class="card-head">
        <h2>Gas</h2>
        <span class="muted" id="gas-total"></span>
      </div>
      <div class="chart fill" id="gas-chart" data-height="160"></div>
    </section>
  </template>

  <template id="block-prices">
    <section class="card prices-card">
      <div class="card-head">
        <h2>Stroomprijs</h2>
        <span class="muted" id="prices-source"></span>
      </div>
      <p class="block-empty" id="prices-empty" hidden>Geen prijzen beschikbaar.</p>
      <div class="prices-body" data-prices>
        <div class="big-fact">
          <span class="big-number" id="price-now">–</span>
          <span class="big-unit">per kWh nu</span>
        </div>
        <ul class="facts" id="price-facts"></ul>
      </div>
      <div class="chart fill" id="prices-chart" data-height="150" data-prices></div>
    </section>
  </template>

  <template id="block-gauges">
    <section class="card">
      <div class="card-head">
        <h2>Kengetallen</h2>
        <span class="muted" id="gauges-period"></span>
      </div>
      <div class="gauges fill" id="gauges"></div>
    </section>
  </template>

  <template id="block-devices">
    <section class="card">
      <div class="card-head">
        <h2>Verbruik per apparaat</h2>
        <span class="muted" id="devices-period"></span>
      </div>
      <ul class="consumers fill scroll" id="device-energy"></ul>
    </section>
  </template>

  <template id="block-costs">
    <section class="card">
      <div class="card-head">
        <h2>Kosten</h2>
        <span class="muted" id="costs-period"></span>
      </div>
      <div class="fill scroll"><table class="costs" id="costs"></table></div>
    </section>
  </template>

  <template id="block-water">
    <section class="card">
      <div class="card-head">
        <h2>Water</h2>
        <span class="muted" id="water-total"></span>
      </div>
      <p class="block-empty" id="water-empty" hidden>Geen watermeter gevonden. Kies er een bij de instellingen.</p>
      <div class="chart fill" id="water-chart" data-height="160" data-water></div>
    </section>
  </template>

  <template id="block-baseload">
    <section class="card">
      <div class="card-head">
        <h2>Sluipverbruik</h2>
        <span class="muted">vannacht</span>
      </div>
      <p class="block-empty" id="baseload-empty" hidden>Nog niet bekend. Dit wordt berekend uit het verbruik van afgelopen nacht.</p>
      <div class="center" data-baseload>
        <div class="big-fact">
          <span class="big-number" id="baseload-watts">–</span>
          <span class="big-unit">altijd aan</span>
        </div>
        <ul class="facts" id="baseload-facts"></ul>
      </div>
    </section>
  </template>

  <template id="block-phases">
    <section class="card">
      <div class="card-head">
        <h2>Fasebelasting</h2>
        <span class="muted" id="phases-fuse"></span>
      </div>
      <p class="block-empty" id="phases-empty" hidden>Je slimme meter geeft geen waarden per fase door.</p>
      <ul class="phases" id="phases" data-phases></ul>
    </section>
  </template>

  <script src="dashboard.js"></script>
  <script src="site.js"></script>
</body>
</html>
